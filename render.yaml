services:

  # =====================================================
  # BACKEND - SPRING BOOT
  # =====================================================

  - type: web
    name: resume-analyzer-api
    runtime: docker
    rootDir: backend

    healthCheckPath: /actuator/health

    envVars:
      - key: PORT
        value: 8080

      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # -------------------------------------------------
      # DATABASE
      # -------------------------------------------------

      - key: DATABASE_URL
        sync: false

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      # -------------------------------------------------
      # JWT
      # -------------------------------------------------

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRATION
        value: 86400000

      # -------------------------------------------------
      # CORS
      # -------------------------------------------------

      - key: CORS_ALLOWED_ORIGIN
        value: https://resume-pulse-frontend-bbep.onrender.com

      - key: BACKEND_URL
        value: https://resume-analyzer-api-bbep.onrender.com

      - key: FRONTEND_URL
        value: https://resume-pulse-frontend-bbep.onrender.com

      # -------------------------------------------------
      # GROQ
      # -------------------------------------------------

      - key: GROQ_API_KEY
        sync: false

      - key: JOBS_FEED_URL
        value: https://www.arbeitnow.com/api/job-board-api

      - key: JSEARCH_API_KEY
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: RESEND_API_KEY
        sync: false

      # -------------------------------------------------
      # EMAIL / SMTP
      # -------------------------------------------------

      - key: MAIL_HOST
        value: smtp.gmail.com

      - key: MAIL_PORT
        value: 465

      - key: MAIL_SSL_ENABLE
        value: "true"

      - key: MAIL_STARTTLS_ENABLE
        value: "false"

      - key: MAIL_STARTTLS_REQUIRED
        value: "false"

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: MAIL_FROM
        sync: false


  # =====================================================
  # FRONTEND - ANGULAR
  # =====================================================

  - type: web
    name: resume-pulse-frontend-bbep
    runtime: static
    rootDir: frontend

    buildCommand: npm install && node -e "const fs=require('fs'); const p='src/index.html'; let s=fs.readFileSync(p,'utf8'); s=s.replace('__RESUME_API_URL__', process.env.API_URL || ''); s=s.replace('__GOOGLE_CLIENT_ID__', process.env.GOOGLE_CLIENT_ID || ''); fs.writeFileSync(p,s);" && npm run build

    staticPublishPath: ./dist/resume-pulse/browser

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: API_URL
        value: https://resume-analyzer-api-bbep.onrender.com

      - key: GOOGLE_CLIENT_ID
        sync: false