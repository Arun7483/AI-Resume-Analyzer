services:

  # =====================================================
  # BACKEND - SPRING BOOT
  # =====================================================

  - type: web
    name: resume-analyzer-api
    runtime: docker
    rootDir: backend

    healthCheckPath: /actuator/health

    envVars:
      - key: PORT
        value: 8080

      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # -------------------------------------------------
      # DATABASE
      # -------------------------------------------------

      - key: DATABASE_URL
        sync: false

      - key: DATABASE_USERNAME
        sync: false

      - key: DATABASE_PASSWORD
        sync: false

      # -------------------------------------------------
      # JWT
      # -------------------------------------------------

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRATION
        value: 86400000

      # -------------------------------------------------
      # CORS
      # -------------------------------------------------

      - key: CORS_ALLOWED_ORIGIN
        value: https://resume-pulse-frontend-bbep.onrender.com

      # -------------------------------------------------
      # GROQ
      # -------------------------------------------------

      - key: GROQ_API_KEY
        sync: false

      # -------------------------------------------------
      # EMAIL / SMTP
      # -------------------------------------------------

      - key: MAIL_HOST
        sync: false

      - key: MAIL_PORT
        value: 587

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: MAIL_FROM
        sync: false


  # =====================================================
  # FRONTEND - ANGULAR
  # =====================================================

  - type: web
    name: resume-pulse-frontend-bbep
    runtime: static
    rootDir: frontend

    buildCommand: npm install && npm run build

    staticPublishPath: ./dist/resume-pulse

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: API_URL
        value: https://resume-analyzer-api-bbep.onrender.com