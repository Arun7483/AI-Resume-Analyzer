# IntelliJ local profile
# Activate with: spring.profiles.active=local

spring.application.name=resume-analyzer-api
server.port=${PORT:8080}

# PostgreSQL. Use local PostgreSQL defaults or override these in IntelliJ.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/resume_analyzer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Development-only JWT fallback. Set JWT_SECRET in IntelliJ for a custom value.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-before-sharing}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
app.backend-url=${BACKEND_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

app.storage.location=${RESUME_STORAGE_PATH:${user.home}/.resume-pulse/uploads}
app.jobs.feed-url=${JOBS_FEED_URL:https://www.arbeitnow.com/api/job-board-api}
app.jobs.jsearch-api-key=${JSEARCH_API_KEY:}

# Optional AI integration. Resume analysis/chat need GROQ_API_KEY.
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs