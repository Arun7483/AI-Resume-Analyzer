# =====================================================
# APPLICATION
# =====================================================

spring.application.name=resume-analyzer-api
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =====================================================
# SERVER
# =====================================================

server.port=${PORT:8080}


# =====================================================
# DATABASE
# =====================================================

spring.datasource.url=${DATABASE_URL}

spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME}}

spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD}}

spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =====================================================
# FLYWAY
# =====================================================

spring.flyway.enabled=true

spring.flyway.baseline-on-migrate=true


# =====================================================
# JWT
# =====================================================

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration=${JWT_EXPIRATION:86400000}


# =====================================================
# CORS
# =====================================================

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}


# =====================================================
# FILE STORAGE
# =====================================================

app.storage.location=${RESUME_STORAGE_PATH:${java.io.tmpdir}/resume-analyzer/uploads}

app.jobs.adzuna-app-id=${ADZUNA_APP_ID:}
app.jobs.adzuna-app-key=${ADZUNA_APP_KEY:}
app.jobs.adzuna-country=${ADZUNA_COUNTRY:in}
app.jobs.adzuna-max-pages-per-query=${ADZUNA_MAX_PAGES_PER_QUERY:3}
app.jobs.adzuna-max-roles-per-query=${ADZUNA_MAX_ROLES_PER_QUERY:6}


# =====================================================
# AI / GROQ
# =====================================================

spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}


# =====================================================
# EMAIL VERIFICATION LINKS
# =====================================================

app.backend-url=${BACKEND_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}


# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health

management.endpoint.health.show-details=never

# SMTP is an optional integration and should not make Render health checks fail.
management.health.mail.enabled=false


# =====================================================
# OPENAPI / SWAGGER UI
# =====================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
