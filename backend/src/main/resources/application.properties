spring.application.name=resume-analyzer-api

# =====================================================

# SERVER

# =====================================================

server.port=${PORT:8080}

# =====================================================

# DATABASE - AIVEN POSTGRESQL

# =====================================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================

# HIKARI CONNECTION POOL

# =====================================================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =====================================================

# JPA / HIBERNATE

# =====================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# =====================================================

# FLYWAY

# =====================================================

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# =====================================================

# FILE UPLOAD

# =====================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.storage.location=${RESUME_STORAGE_PATH:./uploads}

# =====================================================

# APPLICATION URL

# =====================================================

app.backend-url=${APP_BACKEND_URL}

# =====================================================

# JWT

# =====================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================

# CORS

# =====================================================

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# =====================================================

# GROQ / SPRING AI

# =====================================================

spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY}

spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.2

# =====================================================

# GMAIL SMTP

# =====================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =====================================================

# ACTUATOR

# =====================================================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=falsespring.application.name=resume-analyzer-api

# =====================================================
# SERVER
# =====================================================

server.port=${PORT:8080}


# =====================================================
# DATABASE
# =====================================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA
# =====================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=false


# =====================================================
# FLYWAY
# =====================================================

spring.flyway.enabled=true

spring.flyway.baseline-on-migrate=true


# =====================================================
# JWT
# =====================================================

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration=${JWT_EXPIRATION:86400000}


# =====================================================
# CORS
# =====================================================

app.cors.allowed-origin=${FRONTEND_URL:https://resume-pulse-frontend-bbep.onrender.com}


# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health

management.endpoint.health.probes.enabled=true